<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>REEL — Search</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<a href="#main" class="skip-link">Skip to content</a>
<header id="site-header" class="site-header"></header>

<main id="main" class="wrap">
  <div class="section-head">
    <div>
      <span class="eyebrow">Results</span>
      <h2 id="query-title">Search</h2>
    </div>
  </div>
  <div class="grid" id="results"><div class="state-msg"><div class="spinner"></div></div></div>
</main>

<footer id="site-footer" class="site-footer"></footer>

<script src="config.js"></script>
<script src="app.js"></script>
<script>
  renderChrome();
  const q = qs("q") || "";
  document.getElementById("query-title").textContent = q ? `Results for "${q}"` : "Search";
  const resultsEl = document.getElementById("results");

  // prefill the search box with current query
  const input = document.querySelector(".search-form input");
  if (input) input.value = q;

  async function search() {
    if (!q.trim()) {
      resultsEl.innerHTML = `<div class="state-msg">Type something in the search bar above to find a movie.</div>`;
      return;
    }
    try {
      const data = await tmdb("/search/movie", { query: q });
      renderShelf(resultsEl, data.results);
    } catch (e) {
      showError(resultsEl, e.message);
    }
  }
  search();
</script>
</body>
</html>
